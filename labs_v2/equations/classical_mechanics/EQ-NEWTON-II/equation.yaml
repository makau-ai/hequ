id: EQ-NEWTON-II
name: Newton's Second Law
domain: classical_mechanics

# The canonical form is the implicit form f(variables) = 0 that holds on
# the equation's solution manifold. Newton II says F - m*a = 0. This
# representation is uniform across every entry in the corpus so the
# unification sieves can compare apples to apples.
canonical_form: "F - m*a"

variables:
  F:
    dimension: "[force]"
    unit: "newton"
    meaning: "net (vector) force on the body, summed over all contact and field interactions"
    descriptor:
      object_of_interest: rigid_body
      property: http://qudt.org/vocab/quantitykind/Force
      context: inertial_frame
      constraint: net_external
  m:
    dimension: "[mass]"
    unit: "kilogram"
    meaning: "inertial mass of the body (strictly positive, time-independent)"
    descriptor:
      object_of_interest: rigid_body
      property: http://qudt.org/vocab/quantitykind/Mass
      context: inertial_frame
  a:
    dimension: "[acceleration]"
    unit: "meter / second ** 2"
    meaning: "second time derivative of the centre-of-mass position"
    descriptor:
      object_of_interest: rigid_body
      property: http://qudt.org/vocab/quantitykind/Acceleration
      context: inertial_frame

assumptions:
  - "m is strictly positive (m > 0)"
  - "m is constant in time (not a rocket; not a variable-mass system)"
  - "the reference frame is inertial (non-accelerating, non-rotating to leading order)"
  - "|v| << c: classical, non-relativistic regime"
  - "The body is treated as a point particle, or F is the net force on its centre of mass"

derivation_from:
  - "Axiomatic in Newton (Principia, 1687, Lex II); not derived from anything deeper in that framework."
  - "Equivalent to the Euler–Lagrange equation d/dt(∂L/∂q̇) − ∂L/∂q = 0 for L = (1/2) m v² − V(x), which yields m a = −∂V/∂x = F."
  - "Also obtainable as the flat-spacetime, low-energy limit of the geodesic equation in general relativity."

references:
  - "Goldstein, Classical Mechanics, 3rd ed., §1.1, Eq. (1.3)"
  - "Landau & Lifshitz, Mechanics, §5, Eq. (5.3)"
  - "Newton, Philosophiae Naturalis Principia Mathematica, Lex II (1687)"

axioms:
  - algebraic
  - linear
  - constant_coefficients
  - commutative_factors
  - deterministic
  - classical
  - non_relativistic

# -------------------------------------------------------------------
# failure_modes — machine-checkable validity envelopes + alternatives
#
# Each entry names a specific way Newton II fails when applied outside
# its assumption envelope, expressed as DOV-DSL inequalities that the
# validator parses with framework.dov_dsl and the CI checks at every
# commit.
# -------------------------------------------------------------------
failure_modes:
  - id: F1
    name: "applied in a rotating or accelerating frame without pseudoforces"
    assumption_violated: inertial_frame
    # Extra variables needed to state the envelope that are NOT in the
    # equation's canonical variables block (U, f, L are scale
    # parameters of the flow, not F/m/a).
    envelope_variables:
      U:
        dimension: "[length]/[time]"
        unit: "meter/second"
        meaning: "characteristic flow speed"
      f:
        dimension: "1/[time]"
        unit: "radian/second"
        meaning: "Coriolis parameter (2·Ω·sin(lat))"
      L:
        dimension: "[length]"
        unit: "meter"
        meaning: "characteristic length scale"
    validity_envelope:
      named_groups:
        Ro:
          definition: "U / (f * L)"
          dimensionless: true
          interpretation: "Rossby number (inertial vs Coriolis forces)"
      inequalities:
        - "Ro >= 1"
    detection:
      algorithm: "compute Rossby number Ro = U / (f · L); flag if Ro < 1"
      preconditions: "U, f, L all observable for the system of interest"
    use_instead:
      - target_equation: EQ-NEWTON-II
        reason: >
          Apply Newton II in the rotating-frame formulation with
          explicit Coriolis (-2·Ω×v), centrifugal (-Ω×(Ω×r)), and
          Euler (-dΩ/dt × r) pseudoforce terms. Same equation,
          different frame — not a different law.
        ranking: primary
    historical_example:
      description: >
        Foucault pendulum (Panthéon, Paris, 1851) — first direct
        demonstration that Earth's rotating frame is non-inertial;
        the pendulum plane appears to rotate at f·sin(latitude).
      citation: "Foucault, L. (1851). Comptes Rendus 32, 135."
      evidence_level: primary_experiment
    references:
      - "Landau & Lifshitz, Mechanics, §39 (motion in a non-inertial frame)"
      - "Pedlosky, Geophysical Fluid Dynamics, 2nd ed., §1.4"

  - id: F2
    name: "applied in the relativistic regime where |v| is not << c"
    assumption_violated: non_relativistic
    envelope_variables:
      v:
        dimension: "[length]/[time]"
        unit: "meter/second"
        meaning: "body speed in the lab frame"
      c:
        dimension: "[length]/[time]"
        unit: "meter/second"
        meaning: "speed of light in vacuum"
    validity_envelope:
      named_groups:
        beta:
          definition: "v / c"
          dimensionless: true
          interpretation: "velocity as a fraction of c"
      inequalities:
        - "beta < 0.1"
    detection:
      algorithm: "compute β = v/c; flag if β ≥ 0.1 (Lorentz γ ≈ 1.005 at β=0.1)"
      preconditions: "v observable for the body"
    use_instead:
      - target_equation: EQ-LORENTZ-FACTOR
        reason: >
          Use the relativistic momentum p = γmv with
          γ = 1/sqrt(1 - β²), and the relativistic second law
          F = dp/dt. In the ultra-relativistic limit this
          recovers Newton II as β → 0.
        ranking: primary
    historical_example:
      description: >
        Kaufmann electron-deflection experiments (1901-1906)
        showed that electrons emitted by radium at β ≈ 0.7
        deviated from Newtonian trajectories in a way exactly
        matching γmv — one of the earliest empirical
        demonstrations that Newton II fails at relativistic speeds.
      citation: "Kaufmann, W. (1906). Über die Konstitution des Elektrons. Ann. Phys. 19, 487."
      evidence_level: primary_experiment
    references:
      - "Rindler, Relativity: Special, General, and Cosmological, 2nd ed., §2.6"
      - "Jackson, Classical Electrodynamics, 3rd ed., §11.5"

