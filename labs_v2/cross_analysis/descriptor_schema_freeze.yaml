pre_registered_claims:
- Any novelty candidate produced by the unity-map mechanism after this freeze timestamp must refer to the frozen descriptors.
  If any equation.yaml file's SHA-256 hash changes, that equation is considered de-frozen and a new freeze event must be issued
  before the novelty claim can be made.
- The pre-registered falsifiability protocol for the unity-map mechanism (precision >= 0.50, recall >= 0.80 at n >= 30 equations,
  Cohen's kappa >= 0.80 on a three-annotator ground-truth panel) is binding on this frozen descriptor set and any descriptor
  set derived from it.
- No additional physics-textbook equations will be added to the corpus without an explicit novelty-hypothesis justification.
  New entries must come from communities with minimal physics citation overlap, OR be selected specifically to test a novelty
  hypothesis articulated in NOVELTY_PATHWAY.md.
