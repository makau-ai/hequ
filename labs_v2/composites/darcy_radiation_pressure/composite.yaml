composite_id: CMP-DARCY-RADPRESS-001
name: Photon-pressure-driven seepage from Darcy + radiation momentum deposition
description: >
  THE FIRST NOVELTY CANDIDATE IN THE HEQU.AI CORPUS.

  Darcy's law for porous-media flow accepts a body force per unit
  volume f in its momentum balance:

      u = (k / μ) · (f − ∇p)

  where u is the seepage (superficial) velocity, k is permeability,
  and μ is dynamic viscosity. The standard body force is gravity
  (f = ρg). This composite replaces the body force with RADIATION
  PRESSURE from absorbed photon flux:

      f = α · I / c

  where α is the linear absorption coefficient (1/m) of the pore
  fluid, I is beam intensity (W/m²), and c is the speed of light.
  This is legitimate radiation pressure — photon momentum transfer
  to the absorbing medium at rate dp/dt = αI/c per unit volume —
  not photophoresis (which is a thermal-gradient radiometric force
  on individual particles, a completely different mechanism).

  In a horizontal geometry with ∇p ≈ 0 (no external pressure gradient),
  the composite gives a photon-pressure-driven seepage velocity:

      u = (k · α · I) / (μ · c)

  LITERATURE SEARCH RESULT (2026-04-16, five queries across Web /
  arXiv / Google Scholar): ZERO direct hits on this specific
  coupling. The acoustic analog (sound-wave momentum → pore-fluid
  streaming) exists in the published literature (J. Fluid Mech.);
  the optical analog (photon momentum → pore-fluid seepage) does
  not appear to exist in any indexed source. See:
  NOV_PARAM_OVERLAP_03_literature_search.md for full search record.

  Novelty grade: specialist-literature-novel to genuinely-novel.
  The coupling is physically plausible (absorption-driven body force
  is standard radiation-pressure physics; Darcy's equation accepts
  any body force; the only question is whether anyone has formalized
  the combination and computed u(I)). The answer from the literature
  search is: apparently not.

