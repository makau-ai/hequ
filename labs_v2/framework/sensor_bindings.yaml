# Sensor-to-equation variable bindings for live verification.
#
# Each entry maps a hequ.ai equation variable to a makau.ai
# sensor, enabling automated verification of equation predictions
# against real measured values.
#
# Human-in-the-loop gate: this file is manually authored and
# reviewed. The automation pipeline reads it but does not modify
# it without human approval.

experiments:

  # ================================================================
  # LIVE EXPERIMENTS — using real makau.ai sensors (government APIs)
  # These run NOW against real data. No hardware needed.
  # ================================================================

  # --- Ideal gas law: P and T from weather stations ---
  - id: EXP-IDEAL-GAS-LIVE-001
    equation_id: EQ-IDEAL-GAS
    description: >
      Verify the ideal gas law PV = nRT using live atmospheric
      data from NWS weather stations. At a weather station,
      the air is approximately an ideal gas at standard conditions.
      Given measured P and T, predict the molar volume V_m = RT/P
      and compare against the standard value (~0.0245 m³/mol at
      25°C, 1 atm).
    formula: "R * T / P"
    predicted_variable: V_m
    predicted_unit: "m^3/mol"
    bindings:
      T:
        sensor_id: nws-kiah
        transform: temperature_c
        unit: C
        convert_to_K: true
        description: "Air temperature at Houston Intercontinental"
      P:
        sensor_id: nws-kiah
        transform: pressure_pa
        unit: Pa
        description: "Barometric pressure at Houston"
    constants:
      R: 8.314472               # J/(mol·K)
    tolerance: 0.05
    notes: >
      The ideal gas law is exact for an ideal gas. Real air deviates
      by ~0.1% at standard conditions (van der Waals corrections).
      Tolerance set at 5% to account for altitude, humidity, and
      the non-ideal nature of humid air.

  # --- Clausius-Clapeyron: dew point vs temperature ---
  - id: EXP-CLAUSIUS-CLAPEYRON-LIVE-001
    equation_id: EQ-CLAUSIUS-CLAPEYRON
    description: >
      Verify the Clausius-Clapeyron relation using live dew point
      and temperature readings. The saturation vapor pressure
      e_s(T) = e_s0 · exp(L/(R_v) · (1/T_0 - 1/T)) predicts
      the dew point depression from temperature and humidity.
    formula: "6.112 * exp(17.67 * T_c / (T_c + 243.5))"
    predicted_variable: e_s
    predicted_unit: "hPa"
    bindings:
      T_c:
        sensor_id: nws-kord
        transform: temperature_c
        unit: C
        description: "Air temperature at Chicago O'Hare"
    constants: {}
    tolerance: 0.10
    notes: >
      Uses the Magnus formula (empirical fit to Clausius-Clapeyron).
      Compare predicted saturation vapor pressure to actual vapor
      pressure derived from humidity reading.

  # --- Fourier heat: temperature difference between two cities ---
  - id: EXP-FOURIER-GRADIENT-LIVE-001
    equation_id: EQ-FOURIER-HEAT
    description: >
      NOT a true Fourier conduction experiment (no solid conductor
      between cities). Instead, uses the temperature difference
      between two NWS stations as a LIVE DATA TEST of the pipeline:
      read T_hot and T_cold from real sensors, compute q = k·ΔT/L,
      verify the pipeline executes end-to-end. The physics is
      illustrative, not rigorous — this tests the SOFTWARE, not
      the equation.
    formula: "k * (T_hot - T_cold) / L"
    predicted_variable: q
    predicted_unit: "W/m^2"
    bindings:
      T_hot:
        sensor_id: nws-kiah
        transform: temperature_c
        unit: C
        convert_to_K: true
        description: "Houston temperature (typically warmer)"
      T_cold:
        sensor_id: nws-kden
        transform: temperature_c
        unit: C
        convert_to_K: true
        description: "Denver temperature (typically cooler)"
    constants:
      k: 401.0                   # copper, W/(m·K) — hypothetical conductor
      L: 0.5                     # hypothetical length, m
    tolerance: 1.0               # 100% — this is a pipeline test, not a physics test
    notes: >
      Pipeline integration test. The q value is computed from real
      live temperature data but the "conductor" is hypothetical.
      Verifies: sensor reads work, formula evaluates, residual
      computes, ledger records.

  # --- River flow: USGS discharge ---
  - id: EXP-DARCY-RIVER-LIVE-001
    equation_id: EQ-DARCY
    description: >
      Read live river discharge from USGS gauging station. Not a
      direct Darcy's law test (river flow is open-channel, not
      porous-media), but the flow rate data feeds the pipeline
      for future groundwater-Darcy composites.
    formula: "Q"
    predicted_variable: Q
    predicted_unit: "cfs"
    bindings:
      Q:
        sensor_id: usgs-09380000
        transform: discharge_cfs
        unit: cfs
        description: "Colorado River discharge at Lees Ferry, AZ"
    constants: {}
    tolerance: 0.20

  # ================================================================
  # LOCAL EXPERIMENTS — require M5Stack hardware + POST to makau.ai
  # These become active when sensors are connected.
  # ================================================================

  # --- Fourier heat conduction (real conductor) ---
  - id: EXP-FOURIER-LOCAL-001
    equation_id: EQ-FOURIER-HEAT
    description: >
      True Fourier verification: copper rod with Peltier heat
      source, two KMeter thermocouples at each end.
    formula: "k * (T_hot - T_cold) / L"
    predicted_variable: q
    predicted_unit: "W/m^2"
    bindings:
      T_hot:
        sensor_id: m5-fourier-t-hot     # M5Stack KMeter → POST /api/sensors/ingest
        transform: temperature
        unit: C
      T_cold:
        sensor_id: m5-fourier-t-cold
        transform: temperature
        unit: C
    constants:
      k: 401.0
      L: 0.30
    tolerance: 0.05

  # --- Ohm's law ---
  - id: EXP-OHM-LOCAL-001
    equation_id: EQ-OHM
    formula: "I * R"
    predicted_variable: V
    predicted_unit: "V"
    bindings:
      I:
        sensor_id: m5-ohm-current
        transform: current
        unit: A
      V:
        sensor_id: m5-ohm-voltage
        transform: voltage
        unit: V
    constants:
      R: 120.0
    tolerance: 0.02

  # --- SHO (Newton+Hooke composite) ---
  - id: EXP-SHO-LOCAL-001
    equation_id: CMP-NEWTON-HOOKE-SHO-001
    formula: "2 * 3.14159265 * sqrt(m / k_spring)"
    predicted_variable: T_period
    predicted_unit: "s"
    bindings:
      T_period:
        sensor_id: m5-sho-period
        transform: period
        unit: s
    constants:
      m: 0.5
      k_spring: 50.0
    tolerance: 0.05

# --- Sensor types hequ.ai needs ---
# These are the sensor types that enable equation verification
# across the current corpus. Priority ordered by how many
# equations they unlock.
required_sensor_types:
  - type: temperature
    unit: K or °C
    equations_unlocked:
      - EQ-FOURIER-HEAT (T_hot, T_cold)
      - EQ-ARRHENIUS (T → k(T) rate constant)
      - CMP-FOURIER-FICK-SORET-001 (T profile → C profile)
      - Newton's cooling (T time series)
    priority: 1
    notes: >
      Most versatile sensor type. Unlocks thermal, chemical
      kinetics, and thermodiffusion equations. Thermocouples,
      RTDs, or DHT22 digital sensors all work.

  - type: voltage
    unit: V
    equations_unlocked:
      - EQ-OHM (V = IR)
      - CMP-NEWTON-OHM-MOTOR-001 (V_s input, V_back = K·ω)
      - CMP-NEWTON-OHM-VOICECOIL-001 (V_s input, V_back = BL·v)
    priority: 2
    notes: >
      Multimeter or ADC voltage channel. Combined with current
      sensing, unlocks all electrical composites.

  - type: current
    unit: A
    equations_unlocked:
      - EQ-OHM (I in V = IR)
      - CMP-NEWTON-OHM-MOTOR-001 (i = τ_L/K)
      - CMP-NEWTON-OHM-VOICECOIL-001 (i = F_load/BL)
    priority: 2
    notes: >
      Current sense resistor + ADC, or hall-effect sensor.

  - type: displacement
    unit: m
    equations_unlocked:
      - EQ-HOOKE (x displacement from equilibrium)
      - CMP-NEWTON-HOOKE-SHO-001 (x(t) oscillation)
    priority: 3
    notes: >
      LVDT, laser displacement, or ultrasonic range sensor.
      For SHO verification, needs time-series at ≥100 Hz.

  - type: force
    unit: N
    equations_unlocked:
      - EQ-HOOKE (F_spring = -k·x)
      - EQ-NEWTON-II (F = m·a)
    priority: 3
    notes: >
      Load cell or strain-gauge force sensor.

  - type: flow_rate
    unit: m³/s or m/s
    equations_unlocked:
      - EQ-FICK-DIFFUSION (J mass flux)
      - CMP-DARCY-RADPRESS-001 (u seepage velocity — the novel prediction!)
    priority: 4
    notes: >
      For the Darcy+RadPress novel prediction, needs sensitivity
      to ~10⁻⁶ m/s in a porous sample. Differential pressure
      transducer or PIV (particle image velocimetry) could work.

  - type: pressure
    unit: Pa
    equations_unlocked:
      - Darcy's law (pressure gradient)
      - Bernoulli (pressure along streamline)
    priority: 4

  - type: angular_velocity
    unit: rad/s
    equations_unlocked:
      - CMP-NEWTON-OHM-MOTOR-001 (ω = V_s/K - τ_L·R/K²)
    priority: 5
    notes: >
      Optical encoder or tachometer on a DC motor shaft.
      For the motor composite, reading ω directly validates
      the entire coupled prediction.

  - type: light_intensity
    unit: W/m²
    equations_unlocked:
      - CMP-DARCY-RADPRESS-001 (I beam intensity)
      - EQ-BEER-LAMBERT (transmitted intensity)
    priority: 5
    notes: >
      Photodiode or power meter. For the novel Darcy+RadPress
      prediction, needs calibrated absolute intensity measurement.

  - type: concentration
    unit: mol/m³
    equations_unlocked:
      - EQ-FICK-DIFFUSION (C_high, C_low)
      - CMP-FOURIER-FICK-SORET-001 (C at hot/cold ends)
      - CMP-ARRHENIUS-FICK-001 (reactant concentration)
    priority: 5
    notes: >
      Conductivity probe (for ionic solutes), colorimeter, or
      pH meter (for acid-base). Harder to instrument than T or V.
