<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="hequ.ai">
  <title>hequ.ai</title>
  <!-- Dark navy tile matching the hero's cosmos backdrop -->
  <rect width="64" height="64" rx="12" ry="12" fill="#06050e"/>

  <!-- Five-segment ring: each 72° arc carries one of the brand colors
       in the order the logo reads: H Ember → E Sky Cyan → Q Firefly →
       U Vesper → .AI First Light. The ring is a five-domain discovery
       engine drawn as one unbroken loop — Human, Equation, Quantum,
       Unity, Intelligence. -->
  <g fill="none" stroke-width="6.5" stroke-linecap="round">
    <!-- H — Ember (top, 0° → 72°) -->
    <path d="M 32 7 A 25 25 0 0 1 55.78 24.27" stroke="#E8875A"/>
    <!-- E — Sky Cyan (72° → 144°) -->
    <path d="M 55.78 24.27 A 25 25 0 0 1 46.69 52.23" stroke="#4FC3F7"/>
    <!-- Q — Firefly (144° → 216°) -->
    <path d="M 46.69 52.23 A 25 25 0 0 1 17.31 52.23" stroke="#9BF7C4"/>
    <!-- U — Vesper (216° → 288°) -->
    <path d="M 17.31 52.23 A 25 25 0 0 1 8.22 24.27" stroke="#D8B3F0"/>
    <!-- .AI — First Light (288° → 360°) -->
    <path d="M 8.22 24.27 A 25 25 0 0 1 32 7" stroke="#FFE9B3"/>
  </g>

  <!-- Central equivalence mark (≡) in Sky Cyan — the EQU anchor hue,
       echoing the Flavin-tube underline on the hero wordmark. Three
       stacked bars read as mathematical identity at 32×32+; at 16×16
       they compress to a single bright focal point. -->
  <g fill="#4FC3F7">
    <rect x="20" y="24" width="24" height="3" rx="1.5"/>
    <rect x="20" y="30.5" width="24" height="3" rx="1.5"/>
    <rect x="20" y="37" width="24" height="3" rx="1.5"/>
  </g>
</svg>
