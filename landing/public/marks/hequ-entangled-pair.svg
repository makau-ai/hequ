<?xml version="1.0" encoding="UTF-8"?>
<!--
  hequ.ai — Q/U Entangled Pair Mark (Tier 2 atom)

  The one piece of geometry every other brand touchpoint derives from:
  two orbs at the foci of a static lemniscate (figure-8 / infinity),
  each orb carrying a crescent trace of the other's color.

  - Q-orb: firefly  #9BF7C4  (quantum)   with vesper crescent on right flank
  - U-orb: vesper   #D8B3F0  (unity)     with firefly crescent on left flank
  - Thread: lemniscate passing through both foci, aqua-to-white-to-violet
            gradient (shared state, NOT a channel — no traveling packet)

  Coupled pair representation per the physicist SME: correlation without
  transport. Crescents encode non-separability.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 240 80"
     role="img"
     aria-label="hequ entangled pair — Q and U coupled"
     width="240" height="80">
  <defs>
    <linearGradient id="thread" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%"   stop-color="#9BF7C4" stop-opacity="0.65"/>
      <stop offset="40%"  stop-color="#DCF8E8" stop-opacity="0.88"/>
      <stop offset="60%"  stop-color="#F5E6FC" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#D8B3F0" stop-opacity="0.65"/>
    </linearGradient>
    <radialGradient id="qCrescent" cx="72%" cy="50%" r="55%">
      <stop offset="0%"  stop-color="#D8B3F0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D8B3F0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="uCrescent" cx="28%" cy="50%" r="55%">
      <stop offset="0%"  stop-color="#9BF7C4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#9BF7C4" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Static lemniscate thread through both orb centers (60, 40) and (180, 40). -->
  <path d="M 60 40 C 60 14, 96 14, 120 40 C 144 66, 180 66, 180 40
           C 180 14, 144 14, 120 40 C 96 66, 60 66, 60 40 Z"
        fill="none"
        stroke="url(#thread)"
        stroke-width="1.3"
        stroke-linejoin="round"
        filter="url(#softGlow)"/>

  <!-- Q-orb: firefly base + vesper right-flank crescent -->
  <circle cx="60" cy="40" r="12" fill="#9BF7C4"/>
  <circle cx="60" cy="40" r="12" fill="url(#qCrescent)"/>

  <!-- U-orb: vesper base + firefly left-flank crescent -->
  <circle cx="180" cy="40" r="12" fill="#D8B3F0"/>
  <circle cx="180" cy="40" r="12" fill="url(#uCrescent)"/>
</svg>
